plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.1'
}

group = 'ru.privatenull'
version = '1.0.2'

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

def pnLibraryVersion = '0.0.1-dev.6'

dependencies {
    // Общий рантайм ставит bootstrap, зашейденный в jar; для компиляции нужен только публичный API.
    implementation "io.github.pnfolder:pnlibrary-bootstrap-bukkit:${pnLibraryVersion}"
    compileOnly "io.github.pnfolder:pnlibrary-api:${pnLibraryVersion}"
    compileOnly 'com.destroystokyo.paper:paper-api:1.16.5-R0.1-SNAPSHOT'
}

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}

tasks.processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

tasks.shadowJar {
    archiveClassifier.set('')
    mergeServiceFiles()
    relocate('com.google.gson', 'ru.privatenull.libs.gson')
    relocate('org.pnfolder.pnlibrary.bootstrap', 'ru.privatenull.libs.pnbootstrap')
    relocate('org.pnfolder.pnlibrary.bukkit.bootstrap', 'ru.privatenull.libs.pnbootstrap.bukkit')
    relocate('org.pnfolder.pnlibrary.console', 'ru.privatenull.libs.pnbootstrap.console')
}

tasks.jar {
    archiveClassifier.set('plain')
}

tasks.build {
    dependsOn tasks.shadowJar
}
